name: Update contribution landscape

on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'

permissions:
  contents: read

concurrency:
  group: contribution-landscape
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test calendar parsing and projection
        run: python3 -m unittest discover -s tests -p test_contributions.py
      - name: Render the public GitHub calendar
        run: python3 scripts/render_contributions.py
      - name: Commit only a changed contribution image
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- assets/contributions.svg
          if git diff --cached --quiet -- assets/contributions.svg; then
            echo "Contribution image is unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update contribution landscape' -- assets/contributions.svg
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
